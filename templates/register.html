<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - i Warehouse</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Register</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
          <input
            type="text"
            name="username"
            placeholder="Username"
            value="{{ request.form.username }}"
            required
          />

          <input
            type="email"
            name="email"
            placeholder="Email"
            value="{{ request.form.email }}"
            required
          />

          <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="8"
            required
          />

          <video
            id="registerVideo"
            autoplay
            playsinline
            style="width:100%; border-radius:8px; margin-bottom:15px; display:block;"
          ></video>
          <canvas id="registerCanvas" style="display:none;"></canvas>

          <button type="button" id="captureFace">📷 Capture Face</button>
          <p id="faceStatus" style="text-align:center; margin:10px 0;">
            ❌ No face captured
          </p>

          <input type="hidden" id="face_encoding" name="face_encoding" />

          <button type="submit">Register</button>
        </form>

        <p>
          Already have an account?
          <a href="/login">Login</a>
        </p>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
  </body>
</html>
