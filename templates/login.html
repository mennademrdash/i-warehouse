<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - i Warehouse</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Login</h2>

        <div class="login-tabs">
          <button type="button" id="manualTab" class="active">Manual login </button>
          <button type="button" id="faceTab">login with face</button>
        </div>

      <form method="POST" id="manualLoginForm">
          <input type="email" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <div id="faceLoginForm" style="display:none;">
          <video id="loginVideo" autoplay playsinline style="width:100%; max-width:320px; display:block; margin:10px 0;"></video>
          <canvas id="loginCanvas" style="display:none;"></canvas>
          <button type="button" id="faceLoginBtn">📷 login with face</button>
          <p id="faceLoginStatus"></p>
        </div>

        <p>
          Don't have an account?
          <a href="/register">Register</a>
        </p>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
  </body>
</html>
